[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loxone-musicserver-musicassistant"
version = "1.0.0"
description = "Loxone Music Server / Audioserver emulation for Music Assistant"
readme = "README.md"
authors = [{ name = "TheRudin" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "cryptography>=41.0.0",
    "zeroconf>=0.131.0",
]

[project.scripts]
loxone-musicserver = "loxone_musicserver.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["loxone_musicserver*"]
