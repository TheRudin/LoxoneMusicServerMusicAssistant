services:
  loxone-music-assistant:
    build: .
    container_name: loxone-music-assistant
    restart: unless-stopped
    network_mode: host
    environment:
      - MA_URL=http://192.168.1.10:8095
      - MA_USERNAME=admin
      - MA_PASSWORD=your_password
      - LOXONE_HOST=0.0.0.0
      - LOXONE_APP_PORT=7091
      - LOXONE_MS_PORT=7095
      - LOXONE_DISCOVERY_PORT=7070
      - LOXONE_DATA_DIR=/data
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/data
